[project]
name = "akashic"
version = "0.0.1"
description = "Recursive, triangulated research library: SQLite + sqlite-vec core with an evidence-gated admission law."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlite-vec>=0.1.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
pdf = ["pypdf>=4.0"]

[project.scripts]
akashic = "akashic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["akashic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
